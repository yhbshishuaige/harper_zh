[package]
name = "harper-zh"
version = "0.1.0"
edition = "2024"
description = "Chinese language checking support for Harper (spelling confusions, common errors, CJK-English mix)."
license = "Apache-2.0"
publish = false
repository = "https://github.com/yhbshishuaige/harper_zh"

[dependencies]
harper-core = { path = "../harper-core", version = "2.0.0", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

[dev-dependencies]
pretty_assertions = "1.4.1"
